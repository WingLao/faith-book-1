<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d1b19">
<title>信・動畫故事書</title>
<style>
  :root{
    --bg:#1d1b19; --stage:#f3efe7; --ink:#2b2724; --muted:#8b8279;
    --accent:#c8963e; --accent-ink:#fff; --chip:rgba(255,255,255,.82);
    --line:rgba(43,39,36,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
  #stage{--u:1vw;position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:var(--stage);touch-action:none;
    overflow:hidden;user-select:none;-webkit-user-select:none}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #gl:active{cursor:grabbing}

  /* progress */
  #progress{position:absolute;left:calc(var(--u)*2.2);right:calc(var(--u)*2.2);top:calc(var(--u)*1.8);display:flex;gap:calc(var(--u)*.4);opacity:0;transition:opacity .6s}
  #progress .seg{flex:1;height:calc(var(--u)*.42);border-radius:calc(var(--u)*1);background:var(--line);overflow:hidden}
  #progress .seg i{display:block;height:100%;width:0;background:var(--accent);border-radius:calc(var(--u)*1)}
  #stepinfo{position:absolute;left:calc(var(--u)*2.2);top:calc(var(--u)*3.2);font-size:calc(var(--u)*1.25);color:var(--muted);letter-spacing:.05em;opacity:0;transition:opacity .6s}
  #stepinfo b{color:var(--ink);font-weight:600;margin-left:calc(var(--u)*.6);font-size:calc(var(--u)*1.6)}

  /* volume */
  #audioCtl{position:absolute;right:calc(var(--u)*2.2);top:calc(var(--u)*3.1);display:flex;align-items:center;gap:calc(var(--u)*.8);
    background:var(--chip);backdrop-filter:blur(6px);padding:calc(var(--u)*.5) calc(var(--u)*.9);border-radius:calc(var(--u)*3);opacity:0;transition:opacity .6s}
  #speedBtn{min-width:calc(var(--u)*3.6);border:1px solid var(--line);border-radius:calc(var(--u)*2);background:var(--chip);color:var(--ink);font:inherit;font-size:calc(var(--u)*1.05);font-variant-numeric:tabular-nums;padding:calc(var(--u)*.3) calc(var(--u)*.55);cursor:pointer}
  #stage.port #speedBtn{font-size:calc(var(--u)*1.15)}
  #muteBtn{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);border:0;background:none;cursor:pointer;color:var(--ink);display:grid;place-items:center}
  #muteBtn svg{width:calc(var(--u)*1.7);height:calc(var(--u)*1.7)}
  #vol{width:calc(var(--u)*8);accent-color:var(--accent);cursor:pointer}
  #narratorSelect{max-width:calc(var(--u)*13);border:1px solid var(--line);border-radius:calc(var(--u)*2);background:var(--chip);color:var(--ink);font:inherit;font-size:calc(var(--u)*1.05);padding:calc(var(--u)*.3) calc(var(--u)*.45);cursor:pointer}
  .ready #progress,.ready #stepinfo,.ready #audioCtl{opacity:1}

  /* subtitles */
  #subs{position:absolute;left:50%;bottom:calc(var(--u)*3);transform:translateX(-50%);max-width:calc(var(--u)*58);text-align:center;
    font-size:calc(var(--u)*1.85);line-height:1.45;color:#fff;background:rgba(30,27,24,.72);padding:calc(var(--u)*.55) calc(var(--u)*1.4);
    border-radius:calc(var(--u)*.9);opacity:0;transition:opacity .25s;pointer-events:none;letter-spacing:.03em}
  #subs.on{opacity:1}

  /* controls */
  #controls{position:absolute;left:calc(var(--u)*2.2);bottom:calc(var(--u)*2.4);display:flex;gap:calc(var(--u)*.7);opacity:0;transform:translateY(calc(var(--u)*1));
    transition:opacity .4s,transform .4s;pointer-events:none}
  #controls.on{opacity:1;transform:none;pointer-events:auto}
  .btn{font:inherit;font-size:calc(var(--u)*1.25);border:1px solid var(--line);background:var(--chip);color:var(--ink);
    padding:calc(var(--u)*.7) calc(var(--u)*1.4);border-radius:calc(var(--u)*3);cursor:pointer;backdrop-filter:blur(6px);display:flex;align-items:center;gap:calc(var(--u)*.5);
    transition:transform .15s,background .2s}
  .btn:hover{transform:translateY(-1px);background:#fff}
  .btn:disabled{opacity:.35;cursor:default;transform:none}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn.primary:hover{background:#b9862f}
  .btn svg{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2)}

  /* thumbnail */
  #backdrop{position:absolute;inset:0;background:rgba(20,18,16,.6);opacity:0;pointer-events:none;transition:opacity .45s}
  #backdrop.on{opacity:1;pointer-events:auto;cursor:zoom-out}
  #thumb{position:absolute;right:calc(var(--u)*2.2);bottom:calc(var(--u)*2.4);width:calc(var(--u)*10.5);height:calc(var(--u)*15);background:#fff;border-radius:calc(var(--u)*.6);
    box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1.6) rgba(0,0,0,.18);cursor:zoom-in;overflow:hidden;opacity:0;
    transition:all .5s cubic-bezier(.2,.8,.2,1)}
  #thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .ready #thumb{opacity:1}
  #thumb.zoom{right:calc(50% - calc(var(--u)*18.5));bottom:calc(var(--u)*1.6);width:calc(var(--u)*37);height:calc(var(--u)*53);cursor:zoom-out;border-radius:calc(var(--u)*.4);
    box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) rgba(0,0,0,.4)}
  #thumbTag{position:absolute;right:calc(var(--u)*2.2);bottom:calc(var(--u)*17.8);font-size:calc(var(--u)*.95);color:var(--muted);opacity:0;transition:opacity .4s}
  .ready #thumbTag{opacity:1}

  /* start screen */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);
    background:radial-gradient(ellipse at center,rgba(243,239,231,.55),rgba(243,239,231,.95) 70%);transition:opacity .8s}
  #start.hide{opacity:0;pointer-events:none}
  #start small{font-size:calc(var(--u)*1.2);color:var(--muted);letter-spacing:.3em}
  #start h1{font-size:calc(var(--u)*5.4);font-weight:700;letter-spacing:.12em}
  #start h1 span{color:var(--accent)}
  #start p{font-size:calc(var(--u)*1.3);color:var(--muted);margin-bottom:calc(var(--u)*1.2)}
  #startBtn{font-size:calc(var(--u)*1.7);padding:calc(var(--u)*1.1) calc(var(--u)*3.2)}

  /* finale */
  #finale{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);
    pointer-events:none;opacity:0;transition:opacity .8s}
  #finale.on{opacity:1}
  #finale h2{font-size:calc(var(--u)*5);letter-spacing:.2em;color:var(--ink);text-shadow:0 0 calc(var(--u)*2) #fff,0 0 calc(var(--u)*1) #fff}
  #finale p{font-size:calc(var(--u)*1.4);color:var(--ink);text-shadow:0 0 calc(var(--u)*1) #fff}
  /* fact card */
  #fact{position:absolute;right:calc(var(--u)*2.2);top:calc(var(--u)*7.4);width:calc(var(--u)*25);max-height:calc(var(--u)*29);overflow:auto;background:rgba(255,255,255,.93);
    backdrop-filter:blur(8px);border-radius:calc(var(--u)*1);padding:calc(var(--u)*1.3) calc(var(--u)*1.5) calc(var(--u)*1.1);box-shadow:0 calc(var(--u)*.5) calc(var(--u)*2) rgba(0,0,0,.1);
    opacity:0;transform:translateX(calc(var(--u)*2));transition:opacity .45s,transform .45s;pointer-events:none}
  #fact.on{opacity:1;transform:none;pointer-events:auto}
  #fact .lab{font-size:calc(var(--u)*.95);letter-spacing:.2em;color:var(--accent);font-weight:600}
  #fact h3{font-size:calc(var(--u)*1.55);margin:calc(var(--u)*.35) 0 calc(var(--u)*.6);line-height:1.35}
  #fact p{font-size:calc(var(--u)*1.1);line-height:1.7;color:#4a433d;text-align:justify}
  #fact .ref{font-size:calc(var(--u)*.9);color:var(--muted);margin-top:calc(var(--u)*.7);padding-top:calc(var(--u)*.6);border-top:1px solid var(--line)}
  #fact .row{display:flex;gap:calc(var(--u)*.5);margin-top:calc(var(--u)*.8)}
  #fact .btn{font-size:calc(var(--u)*1);padding:calc(var(--u)*.45) calc(var(--u)*1)}
  #fact .btn.playing{background:var(--accent);color:#fff;border-color:transparent}
  #factClose{position:absolute;right:calc(var(--u)*.8);top:calc(var(--u)*.7);border:0;background:none;font-size:calc(var(--u)*1.3);color:var(--muted);cursor:pointer;line-height:1}
  #factChip{position:absolute;right:calc(var(--u)*2.2);top:calc(var(--u)*7.4);font-size:calc(var(--u)*1.05);padding:calc(var(--u)*.5) calc(var(--u)*1.1);opacity:0;pointer-events:none;transition:opacity .4s}
  #factChip.on{opacity:1;pointer-events:auto}
  #finale small{font-size:calc(var(--u)*.95);color:var(--muted);text-shadow:0 0 calc(var(--u)*.8) #fff;margin-top:calc(var(--u)*.6)}
  /* page turn */
  #page{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.06),#fbf8f2 18%,#f6f1e7);
    transform-origin:left center;opacity:0;box-shadow:calc(var(--u)*-2) 0 calc(var(--u)*4) rgba(0,0,0,.12)}
  #page.turn{animation:turn .9s cubic-bezier(.5,0,.3,1)}
  @keyframes turn{0%{opacity:1;transform:perspective(calc(var(--u)*120)) rotateY(0)}
    100%{opacity:.0;transform:perspective(calc(var(--u)*120)) rotateY(-100deg)}}
  #confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #hint{position:absolute;left:50%;top:calc(var(--u)*5.2);transform:translateX(-50%);font-size:calc(var(--u)*1);color:var(--muted);opacity:0;transition:opacity 1s}
  #hint.on{opacity:.9}
  #art{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .8s;pointer-events:none;background:#f3efe7}
  #art.on{opacity:1}
  #art img,#art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #art img.kb{animation:kb 28s ease-in-out both}
  @keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
  #art video{opacity:0;transition:opacity 1s}
  #art video.on{opacity:1}

  .btn{touch-action:manipulation}
  /* ---- phone, portrait ---- */
  #stage.port #stepinfo{right:calc(var(--u)*15);font-size:calc(var(--u)*1.25)}
  #stage.port #stepinfo b{display:block;margin:calc(var(--u)*.3) 0 0;font-size:calc(var(--u)*2)}
  #stage.port #audioCtl{top:calc(var(--u)*3.2);padding:calc(var(--u)*.5) calc(var(--u)*.8)}
  #stage.port #muteBtn{width:calc(var(--u)*2.8);height:calc(var(--u)*2.8)}
  #stage.port #muteBtn svg{width:calc(var(--u)*2);height:calc(var(--u)*2)}
  #stage.port #vol{width:calc(var(--u)*8)}
  #stage.port #controls{left:calc(var(--u)*2);right:calc(var(--u)*2);bottom:calc(var(--u)*2.2 + env(safe-area-inset-bottom));justify-content:center}
  #stage.port .btn{font-size:calc(var(--u)*1.5);padding:calc(var(--u)*.85) calc(var(--u)*1.5)}
  #stage.port .btn svg{width:calc(var(--u)*1.4);height:calc(var(--u)*1.4)}
  #stage.port #subs{bottom:calc(var(--u)*9 + env(safe-area-inset-bottom));max-width:calc(100% - var(--u)*4);width:max-content;font-size:calc(var(--u)*1.65)}
  #stage.port #thumb{top:calc(var(--u)*8.2);bottom:auto;right:calc(var(--u)*2);width:calc(var(--u)*7.5);height:calc(var(--u)*10.7)}
  #stage.port #thumbTag{display:none}
  #stage.port #thumb.zoom{top:7%;right:3%;width:94%;height:80%}
  #stage.port #fact{left:calc(var(--u)*2);right:calc(var(--u)*2);top:auto;bottom:calc(var(--u)*8 + env(safe-area-inset-bottom));width:auto;max-height:46%;
    transform:translateY(calc(var(--u)*3));padding:calc(var(--u)*1.4) calc(var(--u)*1.6)}
  #stage.port #fact.on{transform:none}
  #stage.port #fact .lab{font-size:calc(var(--u)*1.1)}
  #stage.port #fact h3{font-size:calc(var(--u)*1.8)}
  #stage.port #fact p{font-size:calc(var(--u)*1.42)}
  #stage.port #fact .ref{font-size:calc(var(--u)*1.1)}
  #stage.port #fact .btn{font-size:calc(var(--u)*1.3)}
  #stage.port #factClose{font-size:calc(var(--u)*1.8);right:calc(var(--u)*1.1);top:calc(var(--u)*1)}
  #stage.port #factChip{top:auto;bottom:calc(var(--u)*8.4 + env(safe-area-inset-bottom));right:calc(var(--u)*2);font-size:calc(var(--u)*1.35)}
  #stage.port #hint{top:auto;bottom:calc(var(--u)*16);font-size:calc(var(--u)*1.2);white-space:nowrap}
  #stage.port #start{padding:0 calc(var(--u)*2);text-align:center}
  #stage.port #start h1{font-size:calc(var(--u)*4.6)}
  #stage.port #start small{font-size:calc(var(--u)*1.1);letter-spacing:.15em}
  #stage.port #start p{font-size:calc(var(--u)*1.45)}
  #stage.port #startBtn{font-size:calc(var(--u)*2);padding:calc(var(--u)*1.2) calc(var(--u)*3.5)}
  #stage.port #finale{padding:0 calc(var(--u)*2);text-align:center}
  #stage.port #finale h2{font-size:calc(var(--u)*4.4)}
  #stage.port #finale p{font-size:calc(var(--u)*1.5)}
  #stage.port #finale small{font-size:calc(var(--u)*1.1)}
  /* ---- phone, landscape ---- */
  #stage.land #fact{left:calc(var(--u)*2.2);right:auto;top:calc(var(--u)*7.8);width:calc(var(--u)*27);max-height:calc(100% - var(--u)*15)}
  #stage.land #fact p{font-size:calc(var(--u)*1.25)}
  #stage.land #factChip{left:calc(var(--u)*2.2);right:auto;top:calc(var(--u)*7.8)}
  #stage.land .btn{font-size:calc(var(--u)*1.4)}
  #stage.land #controls{bottom:calc(var(--u)*2 + env(safe-area-inset-bottom))}
  /* page navigation: jump to any page, back to the site home */
  #audioCtl .navBtn{border:0;background:none;cursor:pointer;color:var(--ink);font:inherit;font-size:calc(var(--u)*1.05);display:flex;align-items:center;gap:calc(var(--u)*.35);padding:0 calc(var(--u)*.2);text-decoration:none;white-space:nowrap}
  #audioCtl .navBtn svg{width:calc(var(--u)*1.45);height:calc(var(--u)*1.45)}
  #audioCtl .navBtn:hover{color:var(--accent)}
  #audioCtl .sep{width:1px;align-self:stretch;background:var(--line)}
  #pageMenu{position:absolute;z-index:30;right:calc(var(--u)*2.2);top:calc(var(--u)*6.3);width:calc(var(--u)*24);max-height:calc(100% - var(--u)*8.5);overflow:auto;
    background:rgba(255,255,255,.97);border-radius:calc(var(--u)*1.1);box-shadow:0 calc(var(--u)*.5) calc(var(--u)*2.4) rgba(40,30,20,.2);padding:calc(var(--u)*.5);display:none}
  #pageMenu.on{display:block}
  #pageMenu button{display:flex;gap:calc(var(--u)*.8);width:100%;text-align:left;border:0;background:none;font:inherit;font-size:calc(var(--u)*1.15);line-height:1.4;color:var(--ink);
    padding:calc(var(--u)*.55) calc(var(--u)*.8);border-radius:calc(var(--u)*.6);cursor:pointer}
  #pageMenu button span{color:var(--muted);min-width:calc(var(--u)*1.8);text-align:right}
  #pageMenu button:hover{background:rgba(200,150,62,.13)}
  #pageMenu button.cur{background:var(--accent);color:var(--accent-ink)}
  #pageMenu button.cur span{color:inherit}
  #progress .seg{cursor:pointer}
  #stage.port #audioCtl .navBtn{font-size:0;gap:0}
  #stage.port #vol{display:none}  /* phones have volume keys; the mute button stays */
  #stage.port #narratorSelect{max-width:calc(var(--u)*10);font-size:calc(var(--u)*1.15)}
  #stage.port #audioCtl .navBtn svg{width:calc(var(--u)*2);height:calc(var(--u)*2)}
  #stage.port #pageMenu{width:auto;left:calc(var(--u)*2);right:calc(var(--u)*2);top:calc(var(--u)*9)}
  #stage.port #pageMenu button{font-size:calc(var(--u)*1.7)}
</style>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="art"><img id="artImg" alt=""><video id="artClip" muted loop playsinline preload="auto"></video></div>

  <div id="progress"></div>
  <div id="stepinfo"><span id="stepNo"></span><b id="stepTitle"></b></div>
  <div id="hint">拖曳滑鼠可旋轉視角・滾輪可縮放</div>

  <div id="audioCtl">
    <button class="navBtn" id="pagesBtn" title="跳到其他頁" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h11"/></svg>頁數</button>
    <a class="navBtn" id="homeBtn" href="../index.html" title="回主目錄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>主目錄</a>
    <span class="sep"></span>
    <select id="narratorSelect" aria-label="旁白聲線" title="旁白聲線"><option value="hk" selected>廣東話・曉曼</option><option value="tw">台灣國語・曉臻</option></select>
    <button id="speedBtn" title="旁白速度（按一下切換）" aria-label="旁白速度">1×</button>
    <button id="muteBtn" title="背景音樂靜音"></button>
    <input id="vol" type="range" min="0" max="100" value="45" title="背景音樂音量">
  </div>

  <div id="pageMenu" role="menu" aria-label="頁數"></div>
  <div id="subs"></div>

  <div id="controls">
    <button class="btn" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>上一步</button>
    <button class="btn" id="replayBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>重播</button>
    <button class="btn primary" id="nextBtn">繼續<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <div id="fact"><button id="factClose" title="收起">✕</button>
    <div class="lab">小知識</div><h3 id="factTitle"></h3><p id="factText"></p>
    <div class="ref" id="factRef"></div>
    <div class="row"><button class="btn" id="factPlay">🔊 聆聽小知識</button></div>
  </div>
  <button class="btn" id="factChip">💡 小知識</button>

  <div id="backdrop"></div>
  <div id="thumbTag">課本原頁・點擊放大</div>
  <div id="thumb"><img id="thumbImg" alt="課本頁面"></div>

  <div id="page"></div>
  <canvas id="confetti"></canvas>
  <div id="finale"><h2>讀完了！</h2><p id="finaleText">你已讀完《信——第一部書》・願主與你同在</p><small id="bookRefs">內容參考：教材《信——第一部書》、《天主教教理》梵蒂岡中文版、思高聖經</small></div>

  <div id="start">
    <small id="bookSchool">聖若瑟教區中學第五校・教職慕道班</small>
    <h1 id="bookTitle">信<span>—</span>第一部書</h1>
    <p id="bookSub">一本會動的學習書：13 頁動畫故事，認識耶穌的一生</p>
    <button class="btn primary" id="startBtn">開始閱讀</button>
    <a class="btn" id="homeLink" href="../index.html" style="margin-top:calc(var(--u)*1);text-decoration:none">回主目錄</a>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="data.js"></script>
<script src="facts.js"></script>
<script src="voice-hk_20261015150752.js"></script>
<script src="voice-tw-facts_20261015112750.js"></script>
<script src="art.js"></script>
<script>
(() => {
'use strict';
const STEPS = window.STEPS;
const $ = id => document.getElementById(id);
const stage = $('stage');
// book-level texts come from data.js (window.BOOK), written by gen_audio.py
const BOOK = window.BOOK || {};
if (BOOK.title) {
  document.title = BOOK.title.split('—')[0] + '・動畫故事書';
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

const Sound = (() => {
  let ctx, musicGain, duckGain, sfxGain, noiseBuf, timer, nextTime = 0, step = 0;
  let volume = 0.45, muted = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const BPM = 116, E8 = 60 / BPM / 2;
  // 8-bar loop in C major: C G Am F C G F/G C
  const ROOTS = [48, 43, 45, 41, 48, 43, 41, 48];
  const PADS = [[60,64,67],[59,62,67],[57,60,64],[57,60,65],[60,64,67],[59,62,67],[57,60,65],[60,64,67]];
  const MEL = [
    [76,79,81,79,76,0,74,0],[74,79,83,81,79,0,74,0],[72,76,81,79,76,0,72,0],[69,72,77,76,74,0,72,0],
    [79,76,79,81,79,76,74,72],[74,0,79,0,83,81,79,0],[81,79,77,76,74,76,77,74],[72,0,76,79,84,0,0,0]];
  const BASS = [0,null,7,null,12,null,7,null];

  function init(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
    musicGain = ctx.createGain(); duckGain = ctx.createGain(); sfxGain = ctx.createGain();
    musicGain.connect(duckGain); duckGain.connect(comp); sfxGain.connect(comp);
    sfxGain.gain.value = 0.7; applyVol();
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function applyVol(){ if (musicGain) musicGain.gain.setTargetAtTime(muted ? 0 : volume * 0.55, ctx.currentTime, 0.05); }
  function env(g, t, a, peak, dec){ g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }
  function tone(type, freq, t, peak, dec, dest, a = 0.005){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; env(g, t, a, peak, dec);

  function noise(t, dur, peak, ftype, freq, dest){
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();

      const chord = (bar === 6 && e === 4) ? [59,62,67] : PADS[bar];

        o.type = 'triangle'; o.frequency.value = mtof(m); f.type = 'lowpass'; f.frequency.value = 1400;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.028, t + 0.08);
        g.gain.setValueAtTime(0.028, t + len - 0.1); g.gain.linearRampToValueAtTime(0.0001, t + len);
        o.connect(f); f.connect(g); g.connect(dest); o.start(t); o.stop(t + len + 0.05); });
    }
    if (e === 0 || e === 4) { const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.14);
      env(g, t, 0.003, 0.42, 0.16); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.25); }
    if (e === 2 || e === 6) noise(t, 0.11, 0.09, 'bandpass', 1900, dest);
    noise(t, e % 2 ? 0.035 : 0.02, e % 2 ? 0.05 : 0.025, 'highpass', 7500, dest);
  }
  function sched(){
    while (nextTime < ctx.currentTime + 0.15) { play(step, nextTime); nextTime += E8; step = (step + 1) % 64; }
  }
  return {
    start(){ if (!ctx) init(); ctx.resume(); if (timer) return; nextTime = ctx.currentTime + 0.1; timer = setInterval(sched, 25); },
    setVolume(v){ volume = v; applyVol(); },
    toggleMute(){ muted = !muted; applyVol(); return muted; },
    get muted(){ return muted; },
    duck(on){ if (duckGain) duckGain.gain.setTargetAtTime(on ? 0.45 : 1, ctx.currentTime, 0.25); },
    tick(){ if (!ctx) return; const t = ctx.currentTime;

    flip(){ if (!ctx) return; const t = ctx.currentTime;

    fanfare(){ if (!ctx) return; const t = ctx.currentTime + 0.05;
      [72,76,79,84].forEach((m, i) => { tone('triangle', mtof(m), t + i * 0.11, 0.22, 0.5, sfxGain); tone('sine', mtof(m + 12), t + i * 0.11, 0.06, 0.3, sfxGain); });

      for (let i = 0; i < 14; i++) noise(t + Math.random() * 1.4, 0.06, 0.12 + Math.random() * 0.1, 'bandpass', 2000 + Math.random() * 4000, sfxGain);

    }
  };
})();

let distK = 1;
function layout(){
  const W = innerWidth, H = innerHeight;
  let mode = 'desk', w, h, u;
  if (H > W) { mode = 'port'; w = W; h = H; u = Math.min(W / 40, H / 75, 14); }
  else if (H < 560 || (TOUCH && W < 1100)) { mode = 'land'; w = W; h = H; u = Math.min(H / 40, W / 80); }
  else { w = Math.min(W, H * 16 / 9); h = w * 9 / 16; u = w / 100; }
  stage.classList.toggle('port', mode === 'port'); stage.classList.toggle('land', mode === 'land');
  Object.assign(stage.style, { width: w + 'px', height: h + 'px', aspectRatio: 'auto' });
  stage.style.setProperty('--u', u + 'px');
  const k = mode === 'port' ? 1.55 : 1;

  if (k !== distK) {   // keep the current shot framed when switching orientation
    const off = camera.position.clone().sub(controls.target).multiplyScalar(k / distK);
    camera.position.copy(controls.target).add(off); distK = k;
  }
}

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = p => 1 - Math.pow(1 - p, 3);

const backOut = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

function part(t0, d, update, o = {}){ cur.parts.push({ t0, d, update, tick: o.tick !== false }); cur.dur = Math.max(cur.dur, t0 + d); }

// 3 — the twelve apostles
{
  const { g, view } = section(2); newStep(view);
  const grass = add(g, at(cyl(2.3, 2.3, 0.08, 0xb9cf98, {}, 40), 0, 0.04, 0)); pop(grass, 0.3, 0.8);
  const jesus = add(g, at(person(0xfbf7ee, { halo: true, sash: 0xb8433a }), 0, 0.08, -0.2)); drop(jesus, 1.2);
  const cols = [0x9c6b4e,0x6f7f5a,0x8a5a6a,0x5f7690,0xa88b5c,0x7a6a8f,0x6d8b7d,0xa0705a,0x5c6e7e,0x8f7f65,0x7b5e4a];
  for (let k = 0; k < 12; k++) {
    const a = -Math.PI * 0.82 + k * (Math.PI * 1.64 / 11);
    const isPeter = k === 6;
    const p = add(g, at(person(isPeter ? 0x3d5a8a : cols[k % cols.length], { scale: 0.72, sash: isPeter ? 0xe0b44a : undefined, hair: isPeter ? 0x9a9a9a : undefined }),
      Math.sin(a) * 1.65, 0.08, Math.cos(a) * 1.2 - 0.1));
    p.rotation.y = Math.atan2(-p.position.x, -0.2 - p.position.z);
    if (isPeter) { p.position.set(0.55, 0.08, 0.0); p.rotation.y = -0.35; }   // first among the apostles: next to Jesus
    drop(p, 3.4 + k * 0.32, 0.7, 2.5);

      const mk = (c, o) => grp(at(tor(0.06, 0.018, c, o), 0, 0.12, 0), at(box(0.025, 0.2, 0.025, c, o), 0, -0.02, 0), at(box(0.07, 0.025, 0.025, c, o), 0.035, -0.1, 0));

const N = STEPS.length;

function setStateBefore(i){

const voice = new Audio(); voice.preload = 'auto'; voice.setAttribute('playsinline', '');

const SPEEDS = [0.8, 0.9, 1, 1.1, 1.25];
let speed = 1;
try { const v = parseFloat(localStorage.getItem('faithVoiceSpeed')); if (SPEEDS.includes(v)) speed = v; } catch (e) {}
$('speedBtn').textContent = speed + '×';
function applySpeed(){
  $('speedBtn').textContent = speed + '×';
  [voice, factAudio].forEach(a => { if (a) a.defaultPlaybackRate = a.playbackRate = speed; });
}
$('speedBtn').onclick = () => {

};

}

function go(i){
  if (i < 0 || i >= N) return;
  idx = i; finished = false;
  $('finale').classList.remove('on'); controls.autoRotate = false;
  setStateBefore(i);
  built[i].parts.forEach(p => p.done = false);
  tStep = 0; animDone = false; voiceDone = false; playing = true;
  $('controls').classList.remove('on'); hideFact();
  if (i > 0) { const pg = $('page'); pg.classList.remove('turn'); void pg.offsetWidth; pg.classList.add('turn'); Sound.flip(); }

}

function updateSubs(){
  const el = $('subs');
  if (idx < 0) { el.classList.remove('on'); return; }
  const factPlaying = factAudio && !factAudio.paused;
  const track = factPlaying ? factAudio : audio;
  const cues = factPlaying
    ? (narrator === 'hk' ? VOICE_HK.facts[idx].cues : VOICE_TW_FACTS[idx].cues)
    : (narrator === 'hk' ? VOICE_HK.steps[idx].cues : STEPS[idx].cues);
  if (!track) { el.classList.remove('on'); return; }
  const t = track.currentTime, cue = cues.find(c => t >= c.s && t < c.e + 0.25);
  if (cue && !track.paused) { if (el.textContent !== cue.t) el.textContent = cue.t; el.classList.add('on'); }
  else el.classList.remove('on');
}

function drawMute(){
  $('muteBtn').innerHTML = Sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  $('muteBtn').title = Sound.muted ? '取消靜音' : '背景音樂靜音';
}
drawMute();
const thumb = $('thumb'), backdrop = $('backdrop');
function toggleZoom(on){ thumb.classList.toggle('zoom', on); backdrop.classList.toggle('on', on); }
thumb.onclick = () => toggleZoom(!thumb.classList.contains('zoom'));
backdrop.onclick = () => toggleZoom(false);
addEventListener('keydown', e => {
  if (e.key === 'Escape') { toggleZoom(false); toggleMenu(false); }
  if (!$('controls').classList.contains('on')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('nextBtn').click(); }
  if (e.key === 'ArrowLeft' && idx > 0) go(idx - 1);
});

/* ---------- confetti ---------- */
const confettiCanvas = $('confetti'), cx = confettiCanvas.getContext('2d');
let bits = [];
const CCOL = ['#e0b44a', '#e0566a', '#5f9ad0', '#7fbf7a', '#b07ad0', '#f29b4e', '#ffffff'];
function burst(){
  const W = confettiCanvas.width, H = confettiCanvas.height;
  for (let k = 0; k < 260; k++) {
    const left = k % 2 === 0, x = left ? W * 0.05 : W * 0.95, a = (left ? -Math.PI / 3.2 : -Math.PI + Math.PI / 3.2) + (Math.random() - 0.5) * 0.7;
    const v = (0.018 + Math.random() * 0.016) * H;
    bits.push({ x, y: H * 0.95, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      w: (6 + Math.random() * 8) * devicePixelRatio, h: (3 + Math.random() * 5) * devicePixelRatio, c: CCOL[k % CCOL.length], life: 0 });
  }
  for (let k = 0; k < 140; k++) bits.push({ x: Math.random() * W, y: -Math.random() * H * 0.4, vx: (Math.random() - 0.5) * 2, vy: Math.random() * 2,
    r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, w: (6 + Math.random() * 8) * devicePixelRatio, h: (3 + Math.random() * 5) * devicePixelRatio, c: CCOL[k % CCOL.length], life: 0 });
}
function drawConfetti(){
  const W = confettiCanvas.width, H = confettiCanvas.height;
  cx.clearRect(0, 0, W, H);
  if (!bits.length) return;
  const g = H * 0.00045;
  bits.forEach(b => { b.vy += g * 1.2; b.vx *= 0.99; b.vy *= 0.99; b.x += b.vx + Math.sin(b.life * 0.1) * 0.6; b.y += b.vy; b.r += b.vr; b.life++;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.scale(1, Math.cos(b.life * 0.15)); cx.fillStyle = b.c; cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); cx.restore(); });
  bits = bits.filter(b => b.y < H + 40 && b.life < 600);
}
function celebrate(){
  finished = true;
  burst(); setTimeout(burst, 700); Sound.fanfare();
  $('finale').classList.add('on'); $('controls').classList.remove('on'); hideFact();
  moveCamera({ pos: new THREE.Vector3(0, 13, 21), target: new THREE.Vector3(0, 1, 0) });
  setTimeout(() => { controls.autoRotate = true; $('controls').classList.add('on');
    $('nextBtn').innerHTML = '再慶祝一次 🎉'; }, 2600);
  segFill.forEach(f => f.style.width = '100%');
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  if (playing && idx >= 0) {
    tStep += dt;
    const st = built[idx];
    st.parts.forEach(p => {
      const v = clamp((tStep - p.t0) / p.d);
      if (tStep >= p.t0) p.update(v);
      if (v >= 1 && !p.done) { p.done = true; if (p.tick) Sound.tick(); }
    });
    if (tStep >= st.dur) animDone = true;
    const vp = audio && audio.duration ? clamp(audio.currentTime / audio.duration) : 0;
    segFill[idx].style.width = (Math.min(clamp(tStep / st.dur), voiceDone ? 1 : vp) * 100) + '%';
    if (animDone && voiceDone) { playing = false; segFill[idx].style.width = '100%'; $('controls').classList.add('on'); showFact(); }
  }
  if (camTween) {
    camTween.t += dt; const e = easeIO(clamp(camTween.t / camTween.d));
    camera.position.lerpVectors(camTween.fp, camTween.tp, e); controls.target.lerpVectors(camTween.ft, camTween.tt, e);
    if (camTween.t >= camTween.d) camTween = null;
  }
  idle.forEach(f => f(time));
  controls.update();
  if (!artOn) renderer.render(scene, camera);
  updateSubs();
  drawConfetti();
  requestAnimationFrame(frame);
}
addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 200));
layout(); new ResizeObserver(resize).observe(stage); resize();
if (TOUCH) $('hint').textContent = '單指拖曳旋轉視角・雙指縮放';
controls.target.set(0, 0, 0);
// #preview=N shows step N fully built (handy for checking a single step)
const pv = /preview=(\d+)/.exec(location.hash);
if (pv) { const n = clamp(+pv[1], 1, N) - 1; $('start').classList.add('hide'); stage.classList.add('ready');
  setStateBefore(n + 1); idx = n; camera.position.copy(viewPos(built[n].view)); controls.target.copy(built[n].view.target);
  $('stepNo').textContent = `第 ${n + 1} 頁・共 ${N} 頁・${STEPS[n].lesson}`; $('stepTitle').textContent = STEPS[n].title;
  $('thumbImg').src = STEPS[n].img; showArt(n); segFill.forEach((f, k) => f.style.width = k <= n ? '100%' : '0%'); $('controls').classList.add('on'); showFact(); }
requestAnimationFrame(frame);
})();
</script>
